name: Short Video Experiment QA

on:
  workflow_dispatch:
  push:
    branches:
      - short-video-experiment-0.8.47
    paths:
      - "app/**"
      - ".github/scripts/short-video-emulator-qa.sh"
      - ".github/workflows/short-video-experiment-qa.yml"

permissions:
  contents: read

concurrency:
  group: pauza-short-video-experiment-qa
  cancel-in-progress: true

jobs:
  unit:
    name: Short-video regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set experimental version
        run: |
          sed -i 's/versionCode = 11/versionCode = 101/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.51-short-video"/' app/build.gradle.kts

      - name: Run short-video regression tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests "ru.pauza.app.domain.ShortVideoRegressionTest" --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :qa-shortvideo-fixture:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.51-short-video-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator:
    name: Stable-core emulator regression
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set experimental version
        run: |
          sed -i 's/versionCode = 11/versionCode = 101/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.51-short-video"/' app/build.gradle.kts

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :qa-shortvideo-fixture:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run navigation stability with short-video option enabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/short-video-emulator-qa.sh

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauza-0.8.51-short-video-emulator-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14


  release:
    name: Build installable experimental APK
    needs: emulator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set experimental version
        run: |
          sed -i 's/versionCode = 11/versionCode = 101/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.51-short-video"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.8.51-short-video.apk
          test -s Pauza-0.8.51-short-video.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.51-short-video
          path: Pauza-0.8.51-short-video.apk
          if-no-files-found: error
          retention-days: 14
