name: Pauza 0.8.84 End Time Test APK

on:
  push:
    branches:
      - pause-end-time-0.8.84-test
    paths:
      - "app/**"
      - ".github/workflows/end-time-0.8.84.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Isolate test app from the installed Pauza
        run: |
          sed -i '/getByName("debug") {/a\            applicationIdSuffix = ".test"' app/build.gradle.kts
          sed -i 's/versionCode = 11/versionCode = 134/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.84-test"/' app/build.gradle.kts
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pauza-0.8.84-test.apk
          test -s Pauza-0.8.84-test.apk
          sha256sum Pauza-0.8.84-test.apk
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.84-test-apk
          path: Pauza-0.8.84-test.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish prerelease APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create pauza-0.8.84-test Pauza-0.8.84-test.apk --target "$GITHUB_SHA" --prerelease --title "Пауза — 0.8.84 test" --notes "Тестовая APK с отображением времени окончания при выборе длительности. Изолирована от установленной Паузы."
