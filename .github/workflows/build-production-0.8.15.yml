name: Build Pauza 0.8.18 production

on:
  push:
    branches:
      - production-settings-0.8.18

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set production version
        shell: bash
        run: |
          sed -i 's/versionCode = 11/versionCode = 820/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.18"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.18
          path: app/build/outputs/apk/release/app-release.apk
