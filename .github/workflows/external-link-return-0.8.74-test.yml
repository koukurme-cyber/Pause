name: Pauza 0.8.74 External Link Return Test APK

on:
  push:
    branches:
      - external-link-return-0.8.74-test
    paths:
      - "app/**"
      - ".github/workflows/external-link-return-0.8.74-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Isolate test app from the installed Pausa
        run: |
          sed -i '/getByName("debug") {/a\            applicationIdSuffix = ".test"' app/build.gradle.kts
          sed -i 's/versionCode = 11/versionCode = 124/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.74-test"/' app/build.gradle.kts
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pauza-0.8.74-test.apk
          test -s Pauza-0.8.74-test.apk
          sha256sum Pauza-0.8.74-test.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.74-test-apk
          path: Pauza-0.8.74-test.apk
          if-no-files-found: error
          retention-days: 14
