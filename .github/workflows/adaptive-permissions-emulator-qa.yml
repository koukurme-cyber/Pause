name: Pauza 0.8.71 Adaptive Permissions QA

on:
  push:
    branches:
      - adaptive-permissions-0.8.71
    paths:
      - "app/**"
      - ".github/scripts/service-health-visual-emulator-qa.sh"
      - ".github/workflows/adaptive-permissions-emulator-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-visual-qa:
    name: Check visible service failure and recovery on Android 15 emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Set experimental version
        run: |
          sed -i 's/versionCode = 11/versionCode = 121/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.71"/' app/build.gradle.kts
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Prepare 0.8.71 test APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pauza-0.8.71-test.apk
          test -s Pauza-0.8.71-test.apk
          sha256sum Pauza-0.8.71-test.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pauza-0.8.71-test-apk
          path: Pauza-0.8.71-test.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Visual service health regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/service-health-visual-emulator-qa.sh
      - name: Upload screenshots and accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauza-0.8.71-adaptive-permissions-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
