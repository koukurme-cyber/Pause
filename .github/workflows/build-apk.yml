name: Build Pauza Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pauza-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.5.0.apk
          test -s Pauza-0.5.0.apk

          if gh release view pauza-latest >/dev/null 2>&1; then
            gh release upload pauza-latest Pauza-0.5.0.apk --clobber
            gh release delete-asset pauza-latest Pauza-0.4.2.apk -y >/dev/null 2>&1 || true
            gh release edit pauza-latest               --title "Пауза 0.5.0"               --notes "Release build: approved setup UI, compact duration control, app search, flat app list."
          else
            gh release create pauza-latest Pauza-0.5.0.apk               --target "$GITHUB_SHA"               --title "Пауза 0.5.0"               --notes "Release build: approved setup UI, compact duration control, app search, flat app list."
          fi
