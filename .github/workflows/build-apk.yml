name: Build Pauza Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery-stable-0.7.4-timerfix
      - visual-safe-0.8.5-on-0.7.4-timerfix

concurrency:
  group: pauza-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set release version
        shell: bash
        run: |
          sed -i 's/versionCode = 11/versionCode = 68/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.8.5-safe-ui"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publish baseline APK to design release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.8.5-safe-ui.apk
          test -s Pauza-0.8.5-safe-ui.apk

          if gh release view pauza-visual-safe-085-latest >/dev/null 2>&1; then
            gh release upload pauza-visual-safe-085-latest Pauza-0.8.5-safe-ui.apk --clobber
            gh release edit pauza-visual-safe-085-latest --target "$GITHUB_SHA" --title "Пауза — 0.8.5 safe UI" --notes "Approved 0.8.5 visual concept over verified 0.7.4-timerfix. Protection, store, manifest and activity logic are unchanged; active system-bar paddings are excluded."
          else
            gh release create pauza-visual-safe-085-latest Pauza-0.8.5-safe-ui.apk --target "$GITHUB_SHA" --prerelease --title "Пауза — 0.8.5 safe UI" --notes "Approved 0.8.5 visual concept over verified 0.7.4-timerfix. Runtime protection logic remains from baseline."
          fi
