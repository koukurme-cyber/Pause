name: Build and verify Pauza design
on:
  workflow_dispatch:
  push:
    branches: [visual-concept-assets-0.8.7]
concurrency:
  group: pauza-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Build APK and instrumentation
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android UI
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            result=$?
            mkdir -p verification
            adb pull /sdcard/Download/pauza-verification/. verification/ || true
            exit $result
      - name: Upload visual verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauza-design-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/
          if-no-files-found: warn

      - name: Update single design prerelease
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s app/build/outputs/apk/release/app-release.apk || exit 1
          cp app/build/outputs/apk/release/app-release.apk Pauza-design-latest.apk
          mkdir -p verification
          cp -r app/build/reports/androidTests verification/test-reports 2>/dev/null || true
          printf 'Commit: %s\nEmulator step: %s\n' "$GITHUB_SHA" '${{ steps.verify.outcome }}' > verification/build.txt
          zip -r Pauza-design-verification.zip verification

          tag="pauza-design-latest"
          notes="Current design build. Commit: $GITHUB_SHA. Emulator verification: ${{ steps.verify.outcome }}. Physical-device checks remain required."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --target "$GITHUB_SHA" --prerelease --title 'Пауза — текущая дизайн-сборка' --notes "$notes"
            gh release upload "$tag" Pauza-design-latest.apk Pauza-design-verification.zip --clobber
          else
            gh release create "$tag" Pauza-design-latest.apk Pauza-design-verification.zip --target "$GITHUB_SHA" --prerelease --title 'Пауза — текущая дизайн-сборка' --notes "$notes"
          fi

      - name: Clean obsolete visual prereleases and old stable assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Keep only the single mutable design prerelease.
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true and (.tagName | startswith("pauza-visual-"))) | .tagName' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          # The stable release had accumulated every historical APK as an asset.
          # Keep the actual stable 0.8.2 package only.
          if gh release view pauza-latest >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/pauza-latest" --jq '.assets[] | select(.name != "Pauza-0.8.2.apk") | .id' |
            while read -r asset_id; do
              [ -z "$asset_id" ] && continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" || true
            done
          fi

      - name: Clean superseded design workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=visual-concept-assets-0.8.7&per_page=100" > /tmp/runs.json
          jq -r --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id != $current and .status == "completed") | .id' /tmp/runs.json |
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done

      - name: Require successful emulator checks
        if: steps.verify.outcome != 'success'
        run: exit 1
