name: Build Pauza Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - consumer-strict-0.7.3

concurrency:
  group: pauza-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set release version
        shell: bash
        run: |
          sed -i 's/versionCode = 11/versionCode = 43/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.7.3"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.7.3.apk
          test -s Pauza-0.7.3.apk

          if gh release view pauza-latest >/dev/null 2>&1; then
            gh release upload pauza-latest Pauza-0.7.3.apk --clobber
            gh release edit pauza-latest --title "Пауза 0.7.3" --notes "Consumer strict-mode build. Uses the normal launcher, but treats launcher packages as blocked during an active Pause: pressing Home may show the desktop briefly, then Usage Access returns to Pause. Non-whitelisted apps are covered immediately. Accessibility remains fallback. No ROLE_HOME, ADB, Device Owner or screen pinning."
          else
            gh release create pauza-latest Pauza-0.7.3.apk --target "$GITHUB_SHA" --title "Пауза 0.7.3" --notes "Consumer strict-mode build. Usage Access is the primary foreground-app detector; Home and Overview are allowed surfaces, while any non-whitelisted app is immediately covered and returned to Pause. Accessibility remains as fallback and overlay host. No ADB, Device Owner or screen pinning."
          fi
