name: Build Pauza Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - whitelist-only-0.6.29

concurrency:
  group: pauza-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set release version
        shell: bash
        run: |
          sed -i 's/versionCode = 11/versionCode = 37/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.6.29"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.6.29.apk
          test -s Pauza-0.6.29.apk

          if gh release view pauza-latest >/dev/null 2>&1; then
            gh release upload pauza-latest Pauza-0.6.29.apk --clobber
            gh release edit pauza-latest --title "Пауза 0.6.29" --notes "Whitelist-only build. Restores the complete historical Home/Recents accessibility stack from 0.6.21-0.6.24: click/selection/content events, view IDs, HOME visibility, launcher detection and Recents interception. Short-video blocking remains excluded."
          else
            gh release create pauza-latest Pauza-0.6.29.apk --target "$GITHUB_SHA" --title "Пауза 0.6.29" --notes "Whitelist-only build. Restores the complete historical Home/Recents accessibility stack from 0.6.21-0.6.24: click/selection/content events, view IDs, HOME visibility, launcher detection and Recents interception. Short-video blocking remains excluded."
          fi
