name: Build Pauza Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery-stable-0.7.4-baseline

concurrency:
  group: pauza-main-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set release version
        shell: bash
        run: |
          sed -i 's/versionCode = 11/versionCode = 65/' app/build.gradle.kts
          sed -i 's/versionName = "0.6.3"/versionName = "0.7.4-baseline"/' app/build.gradle.kts

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Publish baseline APK to design release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk Pauza-design-latest.apk
          test -s Pauza-design-latest.apk

          if gh release view pauza-design-latest >/dev/null 2>&1; then
            gh release upload pauza-design-latest Pauza-design-latest.apk --clobber
            gh release edit pauza-design-latest --target "$GITHUB_SHA" --title "Пауза — стабильная база 0.7.4" --notes "Exact functional baseline from consumer-strict-0.7.4. Only installable version metadata and test-release publishing changed. Reboot experiments are intentionally excluded."
          else
            gh release create pauza-design-latest Pauza-design-latest.apk --target "$GITHUB_SHA" --prerelease --title "Пауза — стабильная база 0.7.4" --notes "Exact functional baseline from consumer-strict-0.7.4. Only installable version metadata and test-release publishing changed. Reboot experiments are intentionally excluded."
          fi
