name: Build and verify Pauza 0.8.4
on:
  workflow_dispatch:
  push:
    branches: [visual-concept-assets-0.8.4]
concurrency:
  group: pauza-visual-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false
      - name: Build APK and instrumentation
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Android UI
        id: verify
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace; result=$?; mkdir -p verification; adb pull /sdcard/Download/pauza-verification/. verification/ || true; exit $result
      - name: Upload visual verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pauza-0.8.4-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/
          if-no-files-found: warn

      - name: Package review build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s app/build/outputs/apk/release/app-release.apk || exit 1
          cp app/build/outputs/apk/release/app-release.apk Pauza-0.8.4.apk
          mkdir -p verification
          cp -r app/build/reports/androidTests verification/test-reports 2>/dev/null || true
          printf 'Commit: %s\nEmulator step: %s\n' "$GITHUB_SHA" '${{ steps.verify.outcome }}' > verification/build.txt
          zip -r Pauza-0.8.4-verification.zip verification
          tag="pauza-visual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Pauza-0.8.4.apk Pauza-0.8.4-verification.zip --target "$GITHUB_SHA" --prerelease --title 'Пауза 0.8.4 — визуальная проверка' --notes 'Separate visual branch. See verification archive for actual emulator results. Physical device checks remain required.'
      - name: Require successful emulator checks
        if: steps.verify.outcome != 'success'
        run: exit 1
