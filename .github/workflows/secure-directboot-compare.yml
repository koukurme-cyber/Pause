name: Secure Direct Boot Compare 0.7.5 vs 0.7.9

on:
  workflow_dispatch:
  push:
    branches:
      - directboot-accessibility-0.7.9
    paths:
      - "app/**"
      - ".github/scripts/secure-directboot-qa.sh"
      - ".github/workflows/secure-directboot-compare.yml"

concurrency:
  group: pauza-secure-directboot-compare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline-0.7.5
            ref: stable-0.7.5-systemui-fix
          - variant: directboot-accessibility-0.7.9
            ref: directboot-accessibility-0.7.9
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          ref: directboot-accessibility-0.7.9
          path: harness

      - name: Checkout source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build source under test
        working-directory: source
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure secure Direct Boot recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd source && QA_VARIANT=${{ matrix.variant }} bash ../harness/.github/scripts/secure-directboot-qa.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-directboot-${{ matrix.variant }}
          path: qa-artifacts-secure-directboot/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 14
